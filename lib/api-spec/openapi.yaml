openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Mahalo Care single-practice synthetic-data demo API
servers:
  - url: /api
security:
  - session: []
paths:
  /auth/emergency-access:
    post:
      operationId: startEmergencyAccess
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmergencyAccessInput" }
      responses:
        "200": { description: Four-hour maximum patient-only read context, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/emergency-access/end:
    post:
      operationId: endEmergencyAccess
      tags: [auth]
      responses:
        "200": { description: Restored normal staff context, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /auth/location-context:
    post:
      operationId: switchStaffLocation
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationContextInput" }
      responses:
        "200": { description: Current staff role and site context, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { description: Finish or discard tracked activity before switching }
  /patients/{id}/caregivers:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: listPatientCaregivers
      tags: [clinical]
      responses:
        "200":
          description: Retained grants and eligible patient contacts
          content:
            application/json:
              schema: { type: object, required: [grants, contacts], properties: { grants: { type: array, items: { type: object, additionalProperties: true } }, contacts: { type: array, items: { type: object, additionalProperties: true } } } }
    post:
      operationId: grantCaregiverAccess
      tags: [clinical]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaregiverGrantInput" }
      responses:
        "201":
          description: Consent retained and scoped access granted
          content:
            application/json:
              schema: { type: object, required: [grant, documentId], properties: { grant: { type: object, additionalProperties: true }, documentId: { type: ["string", "null"] } } }
  /patients/{id}/caregivers/{grantId}/revoke:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: grantId, required: true, schema: { type: string } }
    post:
      operationId: revokeCaregiverAccess
      tags: [clinical]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaregiverRevocationInput" }
      responses:
        "200": { description: Access revoked immediately, content: { application/json: { schema: { $ref: "#/components/schemas/CaregiverMutationResult" } } } }
  /caregiver/patients:
    get:
      operationId: listCaregiverPatients
      tags: [caregiver]
      responses:
        "200":
          description: Only patients with current effective consent
          content:
            application/json:
              schema: { type: object, required: [patients], properties: { patients: { type: array, items: { $ref: "#/components/schemas/CaregiverPatientSummary" } } } }
  /caregiver/patients/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getCaregiverSharedPatient
      tags: [caregiver]
      responses:
        "200":
          description: Only the explicitly consented sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaregiverPatientDetail" }
        "403": { description: "Access absent, expired or withdrawn" }
  /caregiver/patients/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: sendCaregiverMessage
      tags: [caregiver]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaregiverMessageInput" }
      responses:
        "201": { description: Message recorded under caregiver identity, content: { application/json: { schema: { $ref: "#/components/schemas/CaregiverMutationResult" } } } }
  /caregiver/patients/{id}/careplans/{recordId}/pdf:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: recordId, required: true, schema: { type: string } }
    get:
      operationId: downloadCaregiverPlan
      tags: [caregiver]
      responses:
        "200":
          description: Private retained released care-plan PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /readyz:
    get:
      operationId: getDependencyReadiness
      tags: [operations]
      security: []
      responses:
        "200": { description: Dependencies ready, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "503": { description: Dependencies unavailable or delayed, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /auth/activity:
    post:
      operationId: recordWorkspaceActivity
      tags: [auth]
      responses:
        "200": { description: Human activity recorded, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceUnlockResult" } } } }
        "423": { description: Workspace locked }
  /auth/unlock:
    post:
      operationId: unlockWorkspace
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUnlockInput" }
      responses:
        "200": { description: Workspace unlocked, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceUnlockResult" } } } }
        "401": { description: Incorrect password or locked account }
  /operations/demonstration-status:
    get:
      operationId: getDemonstrationStatus
      tags: [operations]
      responses:
        "200":
          description: Database-backed preparation status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemonstrationStatus" }
  /operations/prepare-demonstration:
    post:
      operationId: prepareDemonstration
      tags: [operations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemonstrationPreparationInput" }
      responses:
        "202":
          description: Tracked background preparation queued
          content:
            application/json:
              schema: { type: object, required: [status, jobId, message], properties: { status: { type: string }, jobId: { type: string }, message: { type: string } } }
  /patients/{id}/clinical-profile:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getClinicalProfile
      tags: [clinical]
      responses:
        "200":
          description: Structured clinical profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalProfile" }
    patch:
      operationId: updateClinicalProfile
      tags: [clinical]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicalProfileInput" }
      responses:
        "200":
          description: Atomically updated clinical profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicalProfile" }
  /patients/{id}/program-progress:
    get:
      operationId: getProgramProgress
      tags: [clinical]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Program-specific progress from billing-equivalent evidence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgramProgress" }
  /patients/{id}/access-export:
    get:
      operationId: exportPatientAccessBundle
      tags: [clinical]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Patient JSON, integrity manifest and retained PDFs
          content:
            application/zip:
              schema: { type: string, format: binary }
  /ai/review-metrics:
    get:
      operationId: getAiReviewMetrics
      tags: [care]
      responses:
        "200":
          description: Authorized thirty-day draft cohort and observed review metrics, not clinical validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiReviewMetrics" }
        default: { description: Request rejected or unavailable }
  /ai/drafts/{id}/check:
    post:
      operationId: checkAiDraftText
      tags: [care]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiDraftTextInput" }
      responses:
        "200":
          description: Recognized quantities compared to the draft's frozen evidence; does not alter the draft or certify clinical correctness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiNumericCheck" }
        default: { description: Request rejected or unavailable }
  /worklists:
    get:
      operationId: getWorklist
      parameters:
        - { in: query, name: kind, required: true, schema: { $ref: "#/components/schemas/WorklistKind" } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 10, maximum: 100 } }
        - { in: query, name: q, schema: { type: string, maxLength: 200 } }
        - { in: query, name: program, schema: { type: string } }
        - { in: query, name: locations, schema: { type: string, description: Comma-separated location names } }
        - { in: query, name: assignee, schema: { type: string } }
        - { in: query, name: ownerRole, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [open, closed, all] } }
        - { in: query, name: period, schema: { type: string } }
        - { in: query, name: includeInactive, schema: { type: boolean } }
      responses:
        "200":
          description: Scoped, sorted and database-paginated clinical worklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorklistPage" }
  /worklists/assign:
    post:
      operationId: assignWorklistRecords
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorklistAssignmentInput" }
      responses:
        "200":
          description: Atomic assignment of every selected accessible record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorklistAssignmentResult" }
  /worklists/consultant-review:
    post:
      operationId: recordConsultantReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsultantReviewInput" }
      responses:
        "200":
          description: Audited consultant review recorded for an active CoCM enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareRecord" }
  /workspace/preferences:
    get:
      operationId: getWorkspacePreferences
      responses:
        "200":
          description: Current user's saved worklist filters and density
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePreferences" }
    patch:
      operationId: updateWorkspacePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspacePreferenceInput" }
      responses:
        "200":
          description: Saved own preferences without overwriting other worklist views
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspacePreferences" }
  /policies:
    get:
      operationId: listProgramPolicies
      responses:
        "200":
          description: Versioned rule packs and templates, including bundled demo baselines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicyList" }
    post:
      operationId: createProgramPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramPolicyInput" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicy" }
  /policies/validate:
    post:
      operationId: validateProgramPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramPolicyInput" }
      responses:
        "200":
          description: Normalized policy and synthetic-fact evidence preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicyValidation" }
  /policies/{policyId}:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProgramPolicy
      responses:
        "200":
          description: Immutable or draft policy document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicy" }
    patch:
      operationId: updateProgramPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramPolicyInput" }
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicy" }
  /policies/{policyId}/review:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    post:
      operationId: reviewProgramPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgramPolicyReviewInput" }
      responses:
        "200":
          description: Review recorded and body frozen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicy" }
  /policies/{policyId}/publish:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishProgramPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyReasonInput" }
      responses:
        "200":
          description: Reviewed version published for eligible new enrollments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicy" }
  /policies/{policyId}/retire:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    post:
      operationId: retireProgramPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyReasonInput" }
      responses:
        "200":
          description: Retired for new use; pinned historical references preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicy" }
  /policies/{policyId}/clone:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    post:
      operationId: cloneProgramPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyCloneInput" }
      responses:
        "201":
          description: New draft version copied without review or publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramPolicy" }
  /healthz:
    get:
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Not signed in
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /auth/password/request:
    post:
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryInput" }
      responses:
        "200":
          description: Generic acknowledgment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /auth/password/reset:
    post:
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetInput" }
      responses:
        "200":
          description: Password set; sign in again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /auth/password/change:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "200":
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /auth/sessions:
    get:
      operationId: listSessions
      responses:
        "200":
          description: Current account sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }
  /auth/sessions/{sessionId}/revoke:
    post:
      operationId: revokeSession
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Practice sign-in accounts, never password hashes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "201":
          description: Account created and local invitation issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountInvitation" }
  /accounts/{accountId}:
    patch:
      operationId: updateAccount
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "200":
          description: Updated account; sessions revoked for access changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /accounts/{accountId}/invitation:
    post:
      operationId: issueAccountInvitation
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: New one-time local invitation or recovery link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountInvitation" }
  /operations/jobs:
    get:
      operationId: listJobs
      responses:
        "200":
          description: Recent durable jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobInfo" }
    post:
      operationId: enqueueMaintenance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceInput" }
      responses:
        "201":
          description: Durable job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobInfo" }
  /operations/jobs/{jobId}/retry:
    post:
      operationId: retryJob
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Failed job requeued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobInfo" }
  /operations/inbox:
    get:
      operationId: listIngestInbox
      responses:
        "200":
          description: Recent webhook events and processing state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InboxInfo" }
  /operations/device-simulate:
    post:
      operationId: simulateDeviceWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceSimulationInput" }
      responses:
        "202":
          description: Signed synthetic event accepted into durable inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxInfo" }
  /webhooks/devices/simulator:
    post:
      operationId: receiveDeviceWebhook
      security: []
      parameters:
        - in: header
          name: x-mahalo-timestamp
          required: true
          schema: { type: string }
        - in: header
          name: x-mahalo-signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEventInput" }
      responses:
        "202":
          description: Verified event durably received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxInfo" }
        "401":
          description: Invalid signature or stale timestamp
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Practice overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /patients:
    get:
      operationId: listPatients
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: program
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Patients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Patient" }
    post:
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientInput" }
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
  /patients/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getPatient
      responses:
        "200":
          description: Patient chart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientDetail" }
    patch:
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatientUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
  /patients/{id}/attachments:
    get:
      operationId: listPatientAttachments
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private supporting PDF metadata, scoped to this patient
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PatientAttachment" } }
  /patients/{id}/attachments/uploads:
    post:
      operationId: requestPatientAttachmentUpload
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentUploadInput" }
      responses:
        "200":
          description: Short-lived private direct-upload ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentUploadTicket" }
  /patients/{id}/attachments/{attachmentId}/complete:
    post:
      operationId: completePatientAttachment
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Validated private PDF sealed into quarantine, never automatically released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientAttachment" }
  /patients/{id}/attachments/{attachmentId}/review:
    post:
      operationId: reviewPatientAttachment
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentReviewInput" }
      responses:
        "200":
          description: Explicit demo release, rejection, revocation or upload cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatientAttachment" }
  /patients/{id}/attachments/{attachmentId}/download:
    get:
      operationId: downloadPatientAttachment
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: attachmentId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Audited attachment download, only after explicit demo release
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /records/{kind}:
    parameters:
      - $ref: "#/components/parameters/Kind"
    get:
      operationId: listRecords
      responses:
        "200":
          description: Domain records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CareRecord" }
    post:
      operationId: createRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareRecord" }
  /records/{kind}/{id}:
    parameters:
      - $ref: "#/components/parameters/Kind"
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getRecord
      responses:
        "200":
          description: One domain record, authorized by its stored patient and actual kind
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareRecord" }
    patch:
      operationId: updateRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordUpdateInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CareRecord" }
  /actions:
    post:
      operationId: performAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionInput" }
      responses:
        "200":
          description: Action outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Practice settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSettings" }
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeSettings" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PracticeSettings" }
  /reports:
    get:
      operationId: getReports
      responses:
        "200":
          description: Operational reporting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportData" }
  /exports/{kind}:
    get:
      operationId: exportData
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [billing, patients, audit, configuration] }
        - in: query
          name: period
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        - in: query
          name: format
          schema: { type: string, enum: [csv, xlsx] }
      responses:
        "200":
          description: Export
          content:
            text/plain:
              schema: { type: string }
  /documents/{id}:
    get:
      operationId: downloadDocument
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /documents/{id}/versions:
    get:
      operationId: listDocumentVersions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Immutable retained artifacts, including prior clinical revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentVersion" }
  /documents/{id}/versions/{versionId}:
    get:
      operationId: downloadDocumentVersion
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: versionId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Exact retained PDF bytes, verified against their checksum
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /documents/{id}/versions/{versionId}/source:
    get:
      operationId: getDocumentSource
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: versionId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Captured source manifest whose digest is printed in the PDF
          content:
            application/json:
              schema:
                type: object
                required: [documentId, sourceHash, source]
                properties:
                  documentId: { type: string }
                  sourceHash: { type: string }
                  source: { type: object, additionalProperties: true }
  /operations/security-overview:
    get:
      operationId: getSecurityOverview
      responses:
        '200':
          description: Governance scope and practice-calendar defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityOverview'
  /operations/security-reports:
    get:
      operationId: listSecurityReports
      parameters:
        - {in: query, name: kind, schema: {$ref: '#/components/schemas/SecurityReportKind'}}
        - {in: query, name: period, schema: {type: string}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Paginated retained reports within the actor's governance scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReportPage'
    post:
      operationId: createSecurityReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityReportCreateInput'
      responses:
        '201':
          description: Snapshot and readable private PDF retained successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReportInfo'
  /operations/security-reports/{id}:
    get:
      operationId: getSecurityReport
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Human-readable captured report data without the large event manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReportView'
  /operations/security-reports/{id}/verify:
    post:
      operationId: verifySecurityReport
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Check pinned private PDF, frozen source and captured audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReportVerification'
  /operations/security-reports/{id}/pdf:
    get:
      operationId: downloadSecurityReportPdf
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Verified retained private PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /operations/security-reports/{id}/json:
    get:
      operationId: downloadSecurityReportJson
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Immutable machine-readable snapshot with the full ordered event manifest
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mahalo_session
  parameters:
    Kind:
      in: path
      name: kind
      required: true
      schema:
        type: string
        enum: [programs, enrollments, consents, careplans, observations, exceptions, tasks, time, notes, devices, messages, interactions, billing, rules, templates, locations, staff, instruments, responses, education, integrations, drafts, notifications, audit]
  schemas:
    EmergencyAccessInput:
      type: object
      required: [mrn, reason, attested]
      properties:
        mrn: { type: string, minLength: 2, maxLength: 100 }
        reason: { type: string, minLength: 20, maxLength: 1000 }
        attested: { type: boolean, const: true }
    EmergencyAccessContext:
      type: ["object", "null"]
      required: [patientId, patientName, mrn, location, reason, startedAt, expiresAt]
      properties:
        patientId: { type: string }
        patientName: { type: string }
        mrn: { type: string }
        location: { type: string }
        reason: { type: string }
        startedAt: { type: string }
        expiresAt: { type: string }
    LocationContextInput:
      type: object
      required: [location]
      properties:
        location: { type: string, minLength: 1, maxLength: 100 }
    LocationRoleAssignments:
      type: object
      maxProperties: 100
      additionalProperties:
        type: string
        enum: [clinical_admin, billing_provider, care_manager, behavioral_care_manager, psychiatric_consultant, therapist, front_desk, billing, read_only]
    CaregiverMutationResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    CaregiverScope:
      type: string
      enum: [careplans.read, readings.read, tasks.read, messages.read, messages.send, education.read, appointments.read]
    CaregiverGrantInput:
      type: object
      required: [contactId, userId, scopes, method, consentText, attested]
      properties:
        contactId: { type: string }
        userId: { type: string }
        scopes: { type: array, minItems: 1, maxItems: 7, items: { $ref: "#/components/schemas/CaregiverScope" } }
        method: { type: string, enum: [verbal, written] }
        consentText: { type: string, minLength: 20, maxLength: 4000 }
        attested: { type: boolean, const: true }
        expiresAt: { type: string, format: date-time }
    CaregiverRevocationInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }
    CaregiverMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
    CaregiverPatientSummary:
      type: object
      required: [id, firstName, lastName, dob, scopes]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        dob: { type: string, format: date }
        scopes: { type: array, items: { $ref: "#/components/schemas/CaregiverScope" } }
    CaregiverSharedRecord:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        date: { type: string }
        description: { type: string }
        goals: { type: string }
        interventions: { type: string }
        careTeam: { type: string }
        value: { type: number }
        unit: { type: string }
        fromName: { type: string }
        body: { type: string }
    CaregiverPatientDetail:
      type: object
      required: [patient, scopes, programs]
      properties:
        patient: { $ref: "#/components/schemas/CaregiverPatientIdentity" }
        scopes: { type: array, items: { $ref: "#/components/schemas/CaregiverScope" } }
        programs: { type: array, items: { type: string } }
        careplans: { type: array, items: { $ref: "#/components/schemas/CaregiverSharedRecord" } }
        readings: { type: array, items: { $ref: "#/components/schemas/CaregiverSharedRecord" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/CaregiverSharedRecord" } }
        messages: { type: array, items: { $ref: "#/components/schemas/CaregiverSharedRecord" } }
        education: { type: array, items: { $ref: "#/components/schemas/CaregiverSharedRecord" } }
        appointments: { type: array, items: { $ref: "#/components/schemas/CaregiverSharedRecord" } }
    CaregiverPatientIdentity:
      type: object
      required: [id, firstName, lastName, dob]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        dob: { type: string, format: date }
    WorkspaceUnlockInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
    WorkspaceUnlockResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    DemonstrationPreparationInput:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, enum: ["PREPARE SYNTHETIC PRACTICE"] }
    DemonstrationStatus:
      type: object
      required: [prepared, patients, documentsPending, synthetic]
      properties:
        prepared: { type: boolean }
        patients: { type: integer }
        documentsPending: { type: boolean }
        synthetic: { type: boolean }
        preparing: { type: boolean }
        error: { type: ["string", "null"] }
    ClinicalCondition:
      type: object
      required: [code, display, chronic, clinicalStatus, source]
      properties:
        id: { type: string }
        code: { type: string, minLength: 1, maxLength: 30 }
        codeSystem: { type: string, default: ICD-10-CM, maxLength: 80 }
        display: { type: string, minLength: 1, maxLength: 250 }
        onsetDate: { type: [string, "null"], format: date }
        chronic: { type: boolean }
        clinicalStatus: { type: string, enum: [active, resolved, inactive] }
        source: { type: string, minLength: 1, maxLength: 250 }
    ClinicalMedication:
      type: object
      required: [name, dose, route, frequency, status]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 250 }
        rxnormCode: { type: [string, "null"], maxLength: 30 }
        dose: { type: string, minLength: 1, maxLength: 150 }
        route: { type: string, minLength: 1, maxLength: 100 }
        frequency: { type: string, minLength: 1, maxLength: 150 }
        indication: { type: string, maxLength: 250, default: "" }
        status: { type: string, enum: [active, stopped, on_hold] }
        startedOn: { type: [string, "null"], format: date }
        reconciledAt: { type: [string, "null"], format: date-time }
        reconciledBy: { type: [string, "null"], maxLength: 250 }
    ClinicalCoverage:
      type: object
      required: [payer, plan, memberId, effectiveFrom, status]
      properties:
        id: { type: string }
        payer: { type: string, minLength: 1, maxLength: 200 }
        plan: { type: string, minLength: 1, maxLength: 200 }
        memberId: { type: string, minLength: 1, maxLength: 100 }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, "null"], format: date }
        status: { type: string, enum: [active, inactive, pending] }
        verifiedAt: { type: [string, "null"], format: date-time }
    ClinicalContact:
      type: object
      required: [name, relationship, emergency, sharingAllowed]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        relationship: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: string, maxLength: 80, default: "" }
        email: { type: string, maxLength: 250, default: "" }
        emergency: { type: boolean }
        sharingAllowed: { type: boolean }
        sharingScope:
          type: array
          maxItems: 6
          items: { type: string, enum: [readings, careplans, tasks, messages, appointments, education] }
        consentRecordedAt: { type: [string, "null"], format: date-time }
    ClinicalIdentifier:
      type: object
      required: [system, value, source]
      properties:
        id: { type: string }
        system: { type: string, minLength: 1, maxLength: 250 }
        value: { type: string, minLength: 1, maxLength: 250 }
        source: { type: string, minLength: 1, maxLength: 100 }
    ClinicalProfileInput:
      type: object
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
        conditions: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ClinicalCondition" } }
        medications: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ClinicalMedication" } }
        coverage: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ClinicalCoverage" } }
        contacts: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/ClinicalContact" } }
        identifiers: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/ClinicalIdentifier" } }
    ClinicalProfile:
      allOf:
        - $ref: "#/components/schemas/ClinicalProfileInput"
        - type: object
          required: [patientId, updatedAt, conditions, medications, coverage, contacts, identifiers]
          properties:
            patientId: { type: string }
            updatedAt: { type: string, format: date-time }
    ProgramProgress:
      type: object
      required: [enrollmentId, program, periodLabel, windowStart, windowEnd, supplyWindowComplete, minutes, minuteTarget, deviceDays, deviceDayTarget, liveInteractions, signedPlan, consent, nextSteps]
      properties:
        enrollmentId: { type: string }
        program: { type: string }
        periodLabel: { type: string }
        windowStart: { type: string, format: date }
        windowEnd: { type: string, format: date }
        supplyWindowComplete: { type: boolean }
        minutes: { type: number }
        minuteTarget: { type: number }
        deviceDays: { type: integer }
        deviceDayTarget: { type: integer }
        liveInteractions: { type: integer }
        signedPlan: { type: boolean }
        consent: { type: boolean }
        policyLabel: { type: string }
        nextSteps: { type: array, items: { type: string } }
    AttachmentUploadInput:
      type: object
      required: [uploadId, filename, sizeBytes, mimeType]
      properties:
        uploadId: { type: string, format: uuid }
        filename: { type: string, minLength: 1, maxLength: 120 }
        sizeBytes: { type: integer, minimum: 1, maximum: 1048576 }
        mimeType: { type: string, enum: [application/pdf] }
    AttachmentUploadTicket:
      type: object
      required: [attachmentId, uploadURL, expiresAt, alreadyComplete]
      properties:
        attachmentId: { type: string }
        uploadURL: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        alreadyComplete: { type: boolean }
    AttachmentReviewInput:
      type: object
      required: [decision, reason, expectedUpdatedAt]
      properties:
        decision: { type: string, enum: [release_demo, reject, revoke, cancel] }
        reason: { type: string, minLength: 20, maxLength: 2000 }
        expectedUpdatedAt: { type: string, format: date-time }
        syntheticSourceConfirmed: { type: boolean }
        unscannedRiskAcknowledged: { type: boolean }
    PatientAttachment:
      type: object
      required: [id, patientId, filename, sizeBytes, mimeType, status, sha256, uploadedBy, createdAt, updatedAt, reviewedBy, reviewedAt, reviewReason, validationError, canCancel, canReview, canDownload]
      properties:
        id: { type: string }
        patientId: { type: string }
        filename: { type: string }
        sizeBytes: { type: integer }
        mimeType: { type: string }
        status: { type: string, enum: [awaiting_upload, quarantined, released_demo, rejected, revoked, canceled] }
        sha256: { type: [string, "null"] }
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        reviewedBy: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewReason: { type: [string, "null"] }
        validationError: { type: [string, "null"] }
        canCancel: { type: boolean }
        canReview: { type: boolean }
        canDownload: { type: boolean }
    DocumentVersion:
      type: object
      required: [id, recordId, version, sourceVersion, origin, sha256, sourceHash, size, contentType, storageBackend, createdAt, createdBy]
      properties:
        id: { type: string }
        recordId: { type: string }
        version: { type: integer }
        sourceVersion: { type: string }
        origin: { type: string }
        sha256: { type: string }
        sourceHash: { type: string }
        size: { type: integer }
        contentType: { type: string }
        storageBackend: { type: string }
        createdAt: { type: string }
        createdBy: { type: string }
    WorklistKind:
      type: string
      enum: [my_exceptions, team_queue, due_today, tasks, at_risk, unsigned, device_issues, cocm_registry]
    WorklistFilters:
      type: object
      properties:
        q: { type: string, maxLength: 200 }
        program: { type: string }
        locations:
          type: array
          maxItems: 100
          items: { type: string }
        assignee: { type: string }
        ownerRole: { type: string }
        status: { type: string, enum: [open, closed, all] }
        period: { type: string }
        pageSize: { type: integer, minimum: 10, maximum: 100 }
        includeInactive: { type: boolean }
    WorklistItem:
      type: object
      required: [id, patientId, patientName, mrn, location, timezone, title, status, severity, assignee, program, record, dueAt, ageHours, issueReasons]
      properties:
        id: { type: string }
        patientId: { type: string }
        patientName: { type: string }
        mrn: { type: string }
        location: { type: string }
        timezone: { type: string }
        title: { type: string }
        status: { type: string }
        severity: { type: string }
        assignee: { type: string }
        ownerRole: { type: [string, "null"] }
        program: { type: [string, "null"] }
        record: { $ref: "#/components/schemas/CareRecord" }
        dueAt: { type: [string, "null"] }
        ageHours: { type: number }
        daysLeft: { type: [integer, "null"] }
        shortfall: { type: [number, "null"] }
        cpt: { type: [string, "null"] }
        latestPhq9: { type: [number, "null"] }
        latestGad7: { type: [number, "null"] }
        scoreTrend: { type: [number, "null"] }
        lastContactAt: { type: [string, "null"] }
        consultantReviewAt: { type: [string, "null"] }
        nextConsultantReviewAt: { type: [string, "null"] }
        consultantReviewDue: { type: boolean }
        issueReasons:
          type: array
          items: { type: string }
    WorklistPage:
      type: object
      required: [kind, page, pageSize, total, totalPages, generatedAt, appliedFilters, options, items]
      properties:
        kind: { $ref: "#/components/schemas/WorklistKind" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        generatedAt: { type: string }
        appliedFilters: { $ref: "#/components/schemas/WorklistFilters" }
        options:
          type: object
          required: [locations, assignees, ownerRoles, programs]
          properties:
            locations:
              type: array
              items: { type: string }
            assignees:
              type: array
              items:
                type: object
                required: [id, name, role]
                properties:
                  id: { type: string }
                  name: { type: string }
                  role: { type: string }
            ownerRoles:
              type: array
              items: { type: string }
            programs:
              type: array
              items: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/WorklistItem" }
    WorklistAssignmentInput:
      type: object
      required: [ids, assigneeId]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
        assigneeId: { type: [string, "null"] }
    WorklistAssignmentResult:
      type: object
      required: [success, count, records]
      properties:
        success: { type: boolean }
        count: { type: integer }
        records:
          type: array
          items: { $ref: "#/components/schemas/CareRecord" }
    ConsultantReviewInput:
      type: object
      required: [patientId, summary, nextReviewDays]
      properties:
        patientId: { type: string }
        summary: { type: string, minLength: 20, maxLength: 12000 }
        nextReviewDays: { type: integer, minimum: 1, maximum: 90 }
        assessmentCompleted: { type: boolean }
    WorkspacePreferences:
      type: object
      required: [density, lastWorklist, worklists]
      properties:
        density: { type: string, enum: [comfortable, compact] }
        lastWorklist: { $ref: "#/components/schemas/WorklistKind" }
        worklists:
          type: object
          additionalProperties: { $ref: "#/components/schemas/WorklistFilters" }
    WorkspacePreferenceInput:
      type: object
      properties:
        density: { type: string, enum: [comfortable, compact] }
        worklist:
          type: object
          required: [kind, filters]
          properties:
            kind: { $ref: "#/components/schemas/WorklistKind" }
            filters: { $ref: "#/components/schemas/WorklistFilters" }
    ProgramPolicyInput:
      type: object
